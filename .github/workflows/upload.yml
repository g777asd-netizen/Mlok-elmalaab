name: Arabic Football Bot

# جدولة ذكية: ٤ تشغيلات يومياً حول أوقات الذروة والمباريات بتوقيت القاهرة
# (١٢ ظهراً، ٥ عصراً، ٩ مساءً، ١١:٣٠ مساءً — UTC+2 شتاءً)
# بدل النشر كل ساعة: جودة أعلى والتزام بسياسة يوتيوب ضد المحتوى المكرر المكثف
on:
  schedule:
    # احتياطي فقط: بعد الميعاد الأساسي (cron-job.org) بـ ٢٠ دقيقة وبدقائق غير مزدحمة
    - cron: '23 10,15,19 * * *'   # 12:23 و 17:23 و 21:23 القاهرة
    - cron: '53 21 * * *'         # 23:53 القاهرة
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط (مقال / يوتيوب / بوست سوشيال / رابط مختصر) - اختياري'
        required: false
        default: ''
        type: string
      keyword:
        description: 'كلمة مفتاحية للبحث عن خبر - اختياري (الرابط له الأولوية)'
        required: false
        default: ''
        type: string
      text:
        description: 'اختياري: الصق نص أو ملخص الفيديو هنا لو يوتيوب حاجب (٣٠٠ حرف على الأقل). بيتكتب منه بس'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: arabic-football-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Skip backup schedule if a run just happened
      id: guard
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        since=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
        n=$(gh api "repos/${{ github.repository }}/actions/runs?created=>=$since&per_page=50" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.name=="Arabic Football Bot") | select(.status!="completed" or .conclusion=="success")] | length' || echo 0)
        echo "recent runs: $n"
        if [ "$n" -gt 0 ]; then echo "skip=true" >> $GITHUB_OUTPUT; fi

    - name: Checkout repository
      if: steps.guard.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      if: steps.guard.outputs.skip != 'true'
      timeout-minutes: 8
      run: |
        sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
        APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
        sudo apt-get $APT update || true
        sudo apt-get $APT install -y --no-install-recommends ffmpeg imagemagick fonts-dejavu-core fonts-freefont-ttf || true
        which ffmpeg
        for f in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
          [ -f "$f" ] && sudo sed -i 's/none/read,write/g' "$f" || true
        done

    - name: Install Python Packages
      if: steps.guard.outputs.skip != 'true'
      run: |
        pip install --upgrade pip
        pip install requests beautifulsoup4 Pillow numpy
        pip install moviepy==1.0.3
        pip install edge-tts groq yt-dlp googlenewsdecoder
        pip install google-genai arabic-reshaper python-bidi youtube-transcript-api
        pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

    - name: Run Bot
      if: steps.guard.outputs.skip != 'true'
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MANUAL_URL: ${{ github.event.inputs.url }}
        MANUAL_KEYWORD: ${{ github.event.inputs.keyword }}
        MANUAL_TEXT: ${{ github.event.inputs.text }}
        YT_COOKIES: ${{ secrets.YT_COOKIES }}
        YT_PROXY: ${{ secrets.YT_PROXY }}
        GEMINI_TTS_VOICE: Charon
      run: python youtube_arabic.py

    - name: Commit and Push Changes
      if: always() && steps.guard.outputs.skip != 'true'
      run: |
        git config --local user.name "Arabic Football Bot"
        git config --local user.email "bot@github.com"
        git pull --rebase || true
        git add history.json source_index.json rotation_state.json failed_links.json || true
        git diff --staged --quiet || git commit -m "Update history and source index [skip ci]"
        git push origin main || git push origin master || true

    - name: Cleanup
      if: always()
      run: |
        rm -f *.jpg *.mp3 *.mp4 *.png *.wav || true
        rm -rf tts_segments || true
